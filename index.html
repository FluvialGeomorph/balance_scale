<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanes Balance Scale</title>
    <script src="calc.js" defer></script>
    <script src="utils.js" defer></script>
    <script src="main.js" defer></script>
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <canvas width="690" height="690" class="myCanvas">
      <p>Add suitable fallback here.</p>
    </canvas>
    <canvas width="950" height="690" class="myCanvas2">
      <p>Add suitable fallback here.</p>
    </canvas>
    <form>
      <div class="wrapper">
        <div class="sizeDiv">
          <label for="size">Bed Material Size (mm): </label>
          <input type="range" name="size" id="size" min="2.00" max="110.00" step="0.01" value="28.66">
          <output class="size-output" for="size"></output>
        </div>
        <div class="slopeDiv">
          <label for="slope">Channel Slope (%): </label>
          <input type="range" name="slope" id="slope" min="0.01" max="1.0" step="0.001" value="0.3">
          <output class="slope-output" for="slope"></output>
        </div>
        <div class="supplyDiv">
          <label for="supply">Bed Load Supply (ft^3/hr per foot width): </label>
          <input type="range" name="supply" id="supply" min="1.00" max="50.00" step="0.01" value="9.02">
          <output class="supply-output" for="supply"></output>
        </div>
        <div class="flowDiv">
          <label for="flow">Flow Rate (cfs per foot width): </label>
          <input type="range" name="flow" id="flow" min="2.0" max="16.0" step="0.1" value="11.1">
          <output class="flow-output" for="flow"></output>
        </div>
        <div class="manningDiv">
          <label for="manning">Manning's Roughness Coefficient (n): </label>
          <input type="range" name="manning" id="manning" min="0.01" max="0.12" step="0.001" value="0.035">
          <output class="manning-output" for="manning"></output>
        </div>
        <div class="selectTransportDiv">
          <label for="selectTransport">Transport Coef. (3 = bed., 6 = susp., current=5.7)</label>
          <select id="selectTransport" name="selectTransport">
            <option value="" selected></option>
            <option value="3.0">3.0</option>
            <option value="3.1">3.1</option>
            <option value="3.2">3.2</option>
            <option value="3.3">3.3</option>
            <option value="3.4">3.4</option>
            <option value="3.5">3.5</option>
            <option value="3.6">3.6</option>
            <option value="3.7">3.7</option>
            <option value="3.8">3.8</option>
            <option value="3.9">3.9</option>
            <option value="4.0">4.0</option>
            <option value="4.1">4.1</option>
            <option value="4.2">4.2</option>
            <option value="4.3">4.3</option>
            <option value="4.4">4.4</option>
            <option value="4.5">4.5</option>
            <option value="4.6">4.6</option>
            <option value="4.7">4.7</option>
            <option value="4.8">4.8</option>
            <option value="4.9">4.9</option>
            <option value="5.0">5.0</option>
            <option value="5.1">5.1</option>
            <option value="5.2">5.2</option>
            <option value="5.3">5.3</option>
            <option value="5.4">5.4</option>
            <option value="5.5">5.5</option>
            <option value="5.6">5.6</option>
            <option value="5.7">5.7</option>
            <option value="5.8">5.8</option>
            <option value="5.9">5.9</option>
            <option value="6.0">6.0</option>
          </select>   
        </div>
        <div class="defaultDiv">
          <button class="buttonDefault" type="button">Reset Stable</button>
        </div>
        <div class="submitDiv">
          <button class="buttonExcel" type="button">Reset Original</button>
        </div>
        <div class="buttonDiv">
          <button class="buttonSetup" type="button">Set Stable</button>
        </div>
        <div class="setTransportDiv">
          <button class="buttonSetTransport" type="button">Set</button>
        </div>
        <div class="selectScenarioDiv">
          <label for="selectScenario">Select Scenario:</label>
          <select id="selectScenario" name="selectScenario">
            <option value="scenario1.png" selected>Scenario 1</option>
            <option value="scenario2.png">Meander Scenario</option>
            <option value="scenario3.png">Scenario 2</option>
          </select>   
        </div>
        <div class="selectNotesDiv">
          <label for="selectNotes">Notes:</label>
          <select id="selectNotes" name="selectNotes">
            <option value="note.png">Notes</option>
          </select>   
        </div>
      </div>
    </form>
  </body>
<!-- 
Answers for Scenario 1, Meander Scenario, and Scenario 2 assuming the following stable condition:
Stable at slope = 0.3%, flow = 11.1, size = 28.66, supply = 9.02 (Default for watershed = 15 sq.mi., S=0.3%).

Scenario 1:
(Assume stable at slope = 0.3%, flow = 11.1, size = 28.66, supply = 9.02)
1.  Answer:  Decrease flow from 11.1 to 8:  Shift towards aggradation: +48%
2.  (Assume slope = 0.3%, flow = 8, size = 28.66, supply = 9.02):  Aggradation:  +48%
    Answer:  Increase slope to 0.416%:  Aggradation:  +0%.
3.  (Assume slope = 0.3%, flow = 8, size = 28.66, supply = 9.02).  
    Answer:  Reduce supply from 9 to 7:  Shift from 48% aggradation to 26% aggradation.
4.  (Assume slope = 0.3%, flow = 8, size = 28.66, supply = 9).  
    Answer:  Reduction from 9 to 4.7 ft3/hr per foot width = 48% reduction.  (9-4.7/9 = 4.3/9 = 48% reduction).

Meander Scenario:
(Assume stable at slope = 0.3%, flow = 11.1, size = 28.66, supply = 9.02)
1.  Answer:  Decrease slope to 0.2%:  Shift towards aggradation: +56%
2.  Answer:  Reduction = 9.02*0.56 = 5.05 ~ 5; New transport capacity = 9.02 - 5.05 = 3.95 ~ 4.
3.  (Assume slope = 0.25%, flow = 16, size = 28.66, supply = 15):  Aggradation: +22%
    Answer:  Reduce supply by 5, from 15 to 10:  Shift towards degradation: -33% to -34%.
    
Scenario 2:
(Assume stable at slope = 0.3%, flow = 11.1, size = 28.66, supply = 9.02)
1.  Answer:  Decrease supply to 1:  Shift towards degradation: -89%
2.  (Assume slope = 0.3%, flow = 11.1, size = 28.66, supply = 1):  Degradation:  -89%
    Answer:  Reduce slope from 0.3% to 0.1%:  Degradation: +0%
-->

</html>
